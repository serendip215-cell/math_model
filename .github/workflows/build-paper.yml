name: Build F-paper PDF
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use bundled TeX Live Chinese fonts on Linux
        run: sed -i 's/fontset=windows/fontset=fandol/' F题_初步方案/paper/main.tex
      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: F题_初步方案/paper
          latexmk_use_xelatex: true
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: F-paper-PDF
          path: F题_初步方案/paper/main.pdf
          if-no-files-found: error
